name: opnsense_cybervulcan
description: >-
  OPNsense Cybervulcan - companion app for a home OPNsense router:
  Proton WireGuard failover status, kill switch, PC mode and whole-house
  VPN bypass, remote access (WireGuard or Tailscale), security tests and a
  Proton server switcher. Windows tray app and
  Android app with widget + Quick Settings tile.
publish_to: 'none'
version: 2.2.0+34

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.3
  shared_preferences: ^2.3.2
  flutter_secure_storage: '>=9.2.2 <11.0.0'
  flutter_local_notifications: ^19.4.0
  # 0.6+ (tray) / 0.6+ (window) are nativeapi rewrites with a different API.
  tray_manager: '>=0.5.0 <0.6.0'
  window_manager: '>=0.5.0 <0.6.0'
  home_widget: '>=0.7.0 <0.10.0'
  path: ^1.9.0
  url_launcher: ^6.3.1
  # dart:ffi helpers for the remote-access (WireGuard) native library.
  ffi: ^2.1.3
  # Public key / settings as QR codes (display only).
  qr_flutter: ^4.1.0
  # Open/save settings and WireGuard .conf files.
  file_selector: ^1.0.3
  # v2.0 app lock: fingerprint / face / device PIN / Windows Hello.
  local_auth: ^3.0.2
  # v2.1: scan provider WireGuard QR codes on the phone. ZXing decodes on the
  # device (no Google ML Kit, nothing sent anywhere).
  flutter_zxing: ^3.1.1
  # v2.1 built-in Tailscale: app-private folder for its login state.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
