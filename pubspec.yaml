name: opnsense_cybervulcan
description: >-
  OPNsense Cybervulcan ("OPn") - companion app for a home OPNsense router:
  Proton WireGuard failover status, kill switch, PC mode and whole-house
  VPN bypass. Windows tray app and Android app with widget + Quick Settings tile.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.3
  shared_preferences: ^2.3.2
  flutter_secure_storage: '>=9.2.2 <11.0.0'
  flutter_local_notifications: ^19.4.0
  tray_manager: '>=0.2.3 <1.0.0'
  window_manager: '>=0.4.2 <1.0.0'
  home_widget: '>=0.7.0 <0.10.0'
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
