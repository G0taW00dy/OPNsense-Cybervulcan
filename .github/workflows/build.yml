name: build

# - Every push / PR to main: analyze + unit tests.
# - Tag v* (e.g. v1.0.0) or manual dispatch: also build the Windows installer
#   (.exe, Inno Setup) and the Android APK, upload them as artifacts, and on a
#   tag publish a GitHub Release with both attached.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned to the stable release the platform folders were generated from.
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  version:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')"
          fi
          # The value is reused in later run: scripts - only allow x.y.z.
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$name' is not x.y.z"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  android:
    needs: [test, version]
    runs-on: ubuntu-latest
    env:
      # Only a flag at job level; the secrets themselves are scoped to the one
      # step that needs them (not exposed to third-party actions).
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      APP_VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure release signing (optional)
        if: env.HAS_KEYSTORE == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # SHA-256 of the release signing certificate (public). The build stops
          # if the keystore in the secrets is a different key.
          EXPECTED_CERT_SHA256: "81:BA:30:5B:1B:F2:FB:1A:38:90:CE:B1:44:1F:18:1A:AD:7E:5F:2A:8C:84:5D:EE:5B:95:29:37:95:AA:0F:8B"
        run: |
          # Secrets pasted through a browser often pick up line breaks or
          # spaces: strip all whitespace before decoding.
          strip() { printf '%s' "$1" | tr -d '[:space:]'; }
          STORE_PW="$(strip "$ANDROID_KEYSTORE_PASSWORD")"
          KEY_PW="$(strip "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}")"
          ALIAS="$(strip "$ANDROID_KEY_ALIAS")"
          if ! strip "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 - re-paste the whole line."
            exit 1
          fi
          if ! keytool -list -keystore android/app/upload-keystore.jks -storepass "$STORE_PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened - check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi
          GOT="$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$STORE_PW" -alias "$ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')"
          echo "Signing certificate SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing key is not the expected Cybervulcan release key."
            exit 1
          fi
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/key.properties
      - name: Note debug signing
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::No ANDROID_KEYSTORE_BASE64 secret - APK is signed with the debug key."
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --build-name="$APP_VERSION"
          --dart-define=APP_VERSION="$APP_VERSION"
          --build-number=${{ github.run_number }}
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Cybervulcan-$APP_VERSION.apk"
      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: cybervulcan-android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    needs: [test, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: >
          flutter build windows --release
          --build-name=${{ needs.version.outputs.name }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.name }}
          --build-number=${{ github.run_number }}
      - name: Bundle the VC++ runtime next to the exe (app-local deployment)
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $dest -ErrorAction Stop
          }
          Get-ChildItem $dest
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ needs.version.outputs.name }}" `
            "/DSourceDir=$pwd\build\windows\x64\runner\Release" `
            installer\cybervulcan.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: cybervulcan-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Cybervulcan ${{ needs.version.outputs.name }}
          files: |
            dist/*.exe
            dist/*.apk
          generate_release_notes: true
