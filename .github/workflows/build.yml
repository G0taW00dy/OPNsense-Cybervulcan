name: build
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TAGS: ts_omit_ace,ts_omit_appconnectors,ts_omit_aws,ts_omit_bird,ts_omit_c2n,ts_omit_capture,ts_omit_captiveportal,ts_omit_clientupdate,ts_omit_completion,ts_omit_conn25,ts_omit_cli,ts_omit_cliconndiag,ts_omit_cloud,ts_omit_colorable,ts_omit_dbus,ts_omit_debugeventbus,ts_omit_debugportmapper,ts_omit_doctor,ts_omit_drive,ts_omit_flashappliance,ts_omit_hujsonconf,ts_omit_identityfederation,ts_omit_iptables,ts_omit_kube,ts_omit_linuxdnsfight,ts_omit_linkspeed,ts_omit_logtail,ts_omit_netlog,ts_omit_networkmanager,ts_omit_oauthkey,ts_omit_osrouter,ts_omit_portlist,ts_omit_posture,ts_omit_qrcodes,ts_omit_relayserver,ts_omit_remoteconfig,ts_omit_resolved,ts_omit_sdnotify,ts_omit_serviceclientprefs,ts_omit_favorites,ts_omit_ssh,ts_omit_synology,ts_omit_syslog,ts_omit_systray,ts_omit_taildrop,ts_omit_tap,ts_omit_tpm,ts_omit_tundevstats,ts_omit_wakeonlan,ts_omit_webbrowser,ts_omit_webclient,ts_omit_advertiseexitnode,ts_omit_advertiseroutes,ts_omit_outboundproxy,ts_omit_dnsresolvecache
jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/cvwg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: tidy
        shell: bash
        run: |
          go mod tidy -diff; go mod tidy
          echo "=====GOMOD"; cat go.mod; echo "=====GOSUM"; cat go.sum; echo "=====END"
          gofmt -l . ; go mod verify
      - name: vet+test
        shell: bash
        run: |
          set +e +o pipefail
          go vet ./... 2>&1 | head -50
          go build -tags "$TAGS" ./... 2>&1 | head -50
          go test -count=1 ./forward ./tunnel 2>&1 | tail -20
          go test -count=1 -v -timeout 300s ./ts 2>&1 | grep -vE "^\s*$" | tail -80
      - name: android+windows
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          pick() { for api in 21 22 23 24 26; do [ -x "$TC/$1$api-clang" ] && { echo "$TC/$1$api-clang"; return; }; done; exit 1; }
          build() { # tags abi goarch triple [goarm]
            d=none; [ "$1" != none ] && d=tags
            mkdir -p "out/$d/android/$2"
            CGO_ENABLED=1 GOOS=android GOARCH=$3 GOARM=${5:-} CC="$(pick $4)" \
              go build -tags "$1" -trimpath -buildmode=c-shared \
              -ldflags='-s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384' \
              -o "out/$d/android/$2/libcvwg.so" . 2>&1 | tail -20
          }
          for tags in none "$TAGS"; do
            build "$tags" arm64-v8a arm64 aarch64-linux-android
            build "$tags" armeabi-v7a arm armv7a-linux-androideabi 7
            build "$tags" x86_64 amd64 x86_64-linux-android
          done
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 >/dev/null
          for tags in none "$TAGS"; do
            d=none; [ "$tags" != none ] && d=tags
            mkdir -p "out/$d/windows"
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
              go build -tags "$tags" -trimpath -buildmode=c-shared -ldflags='-s -w -buildid=' -o "out/$d/windows/cvwg.dll" . 2>&1 | tail -20
          done
          find out -name '*.so' -o -name '*.dll' | xargs ls -la | awk '{print $5, $9}'
          nm -D "out/tags/android/arm64-v8a/libcvwg.so" | grep -E " T (cvts|cvwg)_"
          x86_64-w64-mingw32-objdump -p "out/tags/windows/cvwg.dll" | grep -E "cvts_|cvwg_"
          readelf -lW out/tags/android/arm64-v8a/libcvwg.so | grep LOAD | head -3
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
        if: always()
