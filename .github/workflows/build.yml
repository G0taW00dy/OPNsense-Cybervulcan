name: build

# - Every push / PR to main: analyze + unit tests, Go tests of the native
#   remote-access library, and build the Windows installer (.exe, Inno Setup)
#   and the Android APK as workflow artifacts.
# - Tag v* (e.g. v1.0.0): additionally publish a GitHub Release with both.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned to the stable release the platform folders were generated from.
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Remote access: wireguard-go + gVisor netstack as a C shared library
  # (libcvwg.so per Android ABI, cvwg.dll for Windows), loaded via dart:ffi.
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/cvwg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: native/cvwg/go.sum
      - name: Resolve modules (TEMP until go.sum is committed)
        run: |
          go mod tidy
          mkdir -p out && cp go.mod go.sum out/
          echo "----- go.sum -----"; cat go.sum; echo "----- end -----"
      - name: Verify modules
        run: go mod verify
      - name: Go tests (end-to-end WireGuard tunnel between two user-space peers)
        run: go vet ./... && go test -count=1 ./...
      - name: Android (arm64-v8a, armeabi-v7a, x86_64)
        shell: bash
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls "$TC" | grep -E 'android[0-9]+-clang$' | head -3
          pick() { for api in 21 22 23 24 26; do [ -x "$TC/$1$api-clang" ] && { echo "$TC/$1$api-clang"; return; }; done; exit 1; }
          build() { # abi goarch triple [goarm]
            mkdir -p "out/android/$1"
            CGO_ENABLED=1 GOOS=android GOARCH=$2 GOARM=${4:-} CC="$(pick $3)" \
              go build -trimpath -buildmode=c-shared \
              -ldflags='-s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384' \
              -o "out/android/$1/libcvwg.so" .
            rm -f "out/android/$1/libcvwg.h"
          }
          build arm64-v8a arm64 aarch64-linux-android
          build armeabi-v7a arm armv7a-linux-androideabi 7
          build x86_64 amd64 x86_64-linux-android
          ls -la out/android/*
      - name: Windows (x64 DLL, cross-compiled with MinGW)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          mkdir -p out/windows
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -trimpath -buildmode=c-shared -ldflags='-s -w -buildid=' -o out/windows/cvwg.dll .
          rm -f out/windows/cvwg.h
          ls -la out/windows
      - uses: actions/upload-artifact@v4
        with:
          name: cvwg-native
          path: native/cvwg/out/
          if-no-files-found: error

  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')"
          fi
          # The value is reused in later run: scripts - only allow x.y.z.
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$name' is not x.y.z"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  android:
    needs: [test, version, native]
    runs-on: ubuntu-latest
    env:
      # Only a flag at job level; the secrets themselves are scoped to the one
      # step that needs them (not exposed to third-party actions).
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      APP_VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure release signing (optional)
        if: env.HAS_KEYSTORE == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # SHA-256 of the release signing certificate (public). The build stops
          # if the keystore in the secrets is a different key.
          EXPECTED_CERT_SHA256: "81:BA:30:5B:1B:F2:FB:1A:38:90:CE:B1:44:1F:18:1A:AD:7E:5F:2A:8C:84:5D:EE:5B:95:29:37:95:AA:0F:8B"
        run: |
          # Secrets pasted through a browser often pick up line breaks or
          # spaces: strip all whitespace before decoding.
          strip() { printf '%s' "$1" | tr -d '[:space:]'; }
          STORE_PW="$(strip "$ANDROID_KEYSTORE_PASSWORD")"
          ALIAS="$(strip "$ANDROID_KEY_ALIAS")"
          # Use the secret as-is (minus whitespace); if that isn't clean base64
          # (extra text pasted around it), fall back to its longest base64 run.
          # Either way the certificate check below must match exactly.
          B64="$(strip "$ANDROID_KEYSTORE_BASE64")"
          if ! printf '%s' "$B64" | base64 --decode > /dev/null 2>&1; then
            B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | grep -oE '[A-Za-z0-9+/]{200,}={0,2}' | awk 'length > m { m = length; l = $0 } END { print l }')"
          fi
          if ! printf '%s' "$B64" | base64 --decode > android/app/upload-keystore.jks; then
            BAD="$(printf '%s' "$B64" | tr -d 'A-Za-z0-9+/=' | wc -c)"
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 - re-paste the whole line. (length ${#B64}, length mod 4 = $(( ${#B64} % 4 )), $BAD characters that are not base64)"
            exit 1
          fi
          if ! keytool -list -keystore android/app/upload-keystore.jks -storepass "$STORE_PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened - check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi
          GOT="$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$STORE_PW" -alias "$ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')"
          echo "Signing certificate SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing key is not the expected Cybervulcan release key."
            exit 1
          fi
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$ALIAS"
            # PKCS12 keystores use one password for the store and the key, so
            # use the store password (a mis-pasted key-password secret can't break it).
            echo "keyPassword=$STORE_PW"
          } > android/key.properties
      - name: Note debug signing
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::No ANDROID_KEYSTORE_BASE64 secret - APK is signed with the debug key."
      - uses: actions/download-artifact@v4
        with:
          name: cvwg-native
          path: native-out
      - name: Add the remote-access library (jniLibs)
        run: |
          mkdir -p android/app/src/main/jniLibs
          cp -r native-out/android/* android/app/src/main/jniLibs/
          find android/app/src/main/jniLibs -type f
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --build-name="$APP_VERSION"
          --dart-define=APP_VERSION="$APP_VERSION"
          --build-number=${{ github.run_number }}
      - name: Rename APK (and check the native library is inside)
        run: |
          mkdir -p dist
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep libcvwg.so
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Cybervulcan-$APP_VERSION.apk"
      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: cybervulcan-android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    needs: [test, version, native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: >
          flutter build windows --release
          --build-name=${{ needs.version.outputs.name }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.name }}
          --build-number=${{ github.run_number }}
      - uses: actions/download-artifact@v4
        with:
          name: cvwg-native
          path: native-out
      - name: Bundle the VC++ runtime and the remote-access DLL next to the exe
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          Copy-Item "native-out\windows\cvwg.dll" $dest -ErrorAction Stop
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $dest -ErrorAction Stop
          }
          Get-ChildItem $dest
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ needs.version.outputs.name }}" `
            "/DSourceDir=$pwd\build\windows\x64\runner\Release" `
            installer\cybervulcan.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: cybervulcan-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Cybervulcan ${{ needs.version.outputs.name }}
          files: |
            dist/*.exe
            dist/*.apk
          generate_release_notes: true
